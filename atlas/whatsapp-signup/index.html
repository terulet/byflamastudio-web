<!doctype html>
<html lang="es">
<!--
  Página host del Embedded Signup de WhatsApp (Atlas).

  Qué es: el contenido de ATLAS_WA_ES_URL. La abre la aplicación Atlas con los
  parámetros del alta y devuelve el resultado al servidor local de Atlas.

  Qué lleva dentro: la pareja PÚBLICA de identificadores de Meta que esta
  página admite (App ID y config_id) y el `redirect_uri` que usa. No hay ningún
  secreto: ni App Secret, ni tokens, ni claves.

  Qué NO hace: canjear el `code`. Esta página lo devuelve a Atlas y ahí acaba
  su trabajo. En modo gateway —el de la distribución— Atlas lo reenvía al
  gateway central, que lo canjea con `POST /v1/onboarding/exchange` usando el
  App Secret que vive en Secret Manager. Ninguna instalación tiene ese secreto.

  POR QUÉ REDIRECCIÓN Y NO EL SDK DE JAVASCRIPT
  ---------------------------------------------
  Hasta 3f0b9fb esta página abría el diálogo con `FB.login()` del SDK de Meta.
  Funcionaba hasta el final —Meta emitía el `code`— y el canje moría SIEMPRE
  con `code=100 subcode=36008`: «Error validating verification code. Please
  make sure your redirect_uri is identical to the one you used in the OAuth
  dialog request». Leyendo la URL real del diálogo se vio por qué:

      redirect_uri=https://staticxx.facebook.com/x/connect/xd_arbiter/?version=46
                   #cb=f30991178a099c29f&domain=…&frame=f0c171d67813af00a

  El SDK no usa esta página como `redirect_uri`: usa un URL interno suyo con
  `cb` y `frame` ALEATORIOS EN CADA APERTURA. El canje ocurre en el servidor,
  minutos después y en otra máquina, así que ese valor es irreproducible por
  construcción. No era un fallo de configuración: el canje no podía funcionar.

  El flujo de redirección elimina la incógnita: el `redirect_uri` lo fija esta
  página (REDIRECT_URI, abajo), es el MISMO que el gateway usa al canjear —lee
  `esUrl` de docs/whatsapp-cloud/meta-identificadores.json— y está declarado en
  «URI de redireccionamiento de OAuth válidos» de la app. Tres sitios, un solo
  valor, comprobado por pruebas en los tres.

  Lo que se pierde, dicho sin adornos: el `postMessage` WA_EMBEDDED_SIGNUP con
  `waba_id`/`phone_number_id` solo llega en el flujo de ventana emergente. Sin
  él, el gateway resuelve los activos por lo que el token concede de verdad
  (debug_token + phone_numbers). Con una WABA y un número es exacto; con varios
  candidatos el gateway PARA por ambigüedad en vez de atar uno al azar, que es
  el comportamiento correcto y ya estaba probado.

  El `state` y el `callback` llegan por query string en cada apertura y no se
  almacenan ni se registran en ninguna parte.

  Incidencias de seguridad: contacto del fabricante.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Página operativa, no contenido público: fuera de buscadores. El noindex
       va aquí y NO como Disallow en robots.txt, porque un Disallow impediría
       al rastreador leer este noindex. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <!-- Sin SDK de terceros, la CSP se cierra del todo: el único script que se
       ejecuta es el de esta página, por su hash. Ya no hace falta permitir
       connect.facebook.net ni marcos de facebook.com. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-21qjxNbh1WN8az7IuGjpHvknS4ROFs+HvXYvdq24pU4='; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'" />
  <title>Conectar WhatsApp con Atlas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 10vh auto; padding: 0 20px; color: #223; }
    h1 { font-size: 22px; }
    p { color: #556; line-height: 1.5; font-size: 15px; }
    button { background: #1877f2; color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .error { color: #b3261e; font-size: 14px; }
    .hint { color: #889; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Conectar WhatsApp con Atlas</h1>
  <p>Vas a autorizar la conexión con el proceso oficial de Meta. Al terminar,
     volverás automáticamente a Atlas.</p>
  <button id="go" disabled>Continuar con Meta</button>
  <p id="status" class="hint">Preparando…</p>

  <script>
    'use strict';

    // Enmarcada dentro de otra página, el único botón se puede usar para
    // clickjacking. `frame-ancestors` NO funciona en una CSP declarada por
    // <meta> (la especificación la ignora ahí) y GitHub Pages no permite
    // cabeceras propias, así que la defensa tiene que estar en el script.
    if (window.top !== window.self) {
      document.documentElement.textContent = 'Esta página no puede mostrarse dentro de otra.';
      throw new Error('framed');
    }

    /**
     * Pareja PERMITIDA. Son identificadores PÚBLICOS de Meta —viajan en la URL
     * de cualquier diálogo OAuth, no son secretos— y se fijan aquí por un
     * motivo concreto: sin esto, cualquiera podía enlazar esta página con SU
     * aplicación de Meta y presentar un diálogo de consentimiento ajeno bajo
     * un dominio de confianza. El `code` no se filtraba (va al loopback de la
     * víctima), pero los permisos se concedían a la app del atacante.
     *
     * Los dos parámetros SIGUEN llegando por query string y se comparan contra
     * estos valores: si no coinciden se RECHAZA con un mensaje explícito.
     * Nunca se sustituye en silencio un valor incorrecto por el correcto.
     */
    const APP_ID_PERMITIDO = '2028110217821893';
    const CONFIG_ID_PERMITIDO = '2137703466787056';

    /**
     * El `redirect_uri` del diálogo. Fijo y literal a propósito: tiene que ser
     * IDÉNTICO byte a byte al que usa el gateway al canjear el `code` y al
     * declarado en la app de Meta. Derivarlo de `location` lo haría depender
     * de cómo el servidor sirva la ruta (con o sin barra final, con o sin
     * «index.html»), y una diferencia de un carácter reproduce exactamente el
     * fallo que este cambio arregla. Se COMPRUEBA contra dónde está publicada
     * la página y, si no coinciden, se para: es preferible un error claro aquí
     * a un `subcode=36008` incomprensible veinte minutos después.
     */
    const REDIRECT_URI = 'https://byflamastudio.com/atlas/whatsapp-signup/';

    const params = new URLSearchParams(location.search);
    const statusEl = document.getElementById('status');
    const button = document.getElementById('go');

    function fail(message) {
      statusEl.textContent = message;
      statusEl.className = 'error';
      button.disabled = true;
    }

    /**
     * El destino de retorno SOLO puede ser el servidor local de Atlas. Sin
     * esta comprobación, cualquiera podría enlazar
     * …/whatsapp-signup/?callback=https://sitio-ajeno/ y usar un dominio de
     * confianza como trampolín. Se exige, a la vez:
     *   · hostname EXACTAMENTE 127.0.0.1 (no un subdominio que lo contenga,
     *     no [::1], no un nombre que resuelva a loopback);
     *   · ruta EXACTAMENTE /oauth/whatsapp/callback;
     *   · esquema http/https y sin credenciales embebidas.
     * Se usa el parseo del navegador, nunca una regex sobre la cadena: así las
     * formas 2130706433, 0x7f000001 o 127.1 se normalizan a 127.0.0.1 antes de
     * comparar, y `http://127.0.0.1@otro-host/` se rechaza porque `hostname`
     * devuelve el host real.
     */
    function validCallback(value) {
      try {
        const url = new URL(value);
        return url.hostname === '127.0.0.1'
          && url.pathname === '/oauth/whatsapp/callback'
          && (url.protocol === 'http:' || url.protocol === 'https:')
          && url.username === '' && url.password === '';
      } catch { return false; }
    }

    /**
     * Se RECONSTRUYE la URL de retorno desde origen + ruta fija: cualquier
     * query o fragmento que viniera en `callback` se descarta. Aunque la
     * comprobación de arriba fallara algún día, el destino no puede salir del
     * loopback.
     */
    function returnToAtlas(callback, state, extra) {
      const origen = new URL(callback);
      const url = new URL('/oauth/whatsapp/callback', origen.origin);
      url.searchParams.set('state', state);
      for (const [key, value] of Object.entries(extra)) url.searchParams.set(key, value);
      location.assign(url.toString());
    }

    /**
     * Meta devuelve el `state` TAL CUAL, y es lo único que vuelve con el
     * `code`: en el flujo de redirección la página se recarga desde cero y
     * pierde el `callback` que traía. Así que el viaje de ida lleva ambos
     * dentro del `state`, y el de vuelta los recupera.
     *
     * No es un canal de confianza —lo controla quien abre el enlace— y por eso
     * a la vuelta se vuelve a validar TODO: la forma del state original y que
     * el destino siga siendo el loopback de Atlas. Es transporte, no permiso.
     * Base64 «url-safe» porque el valor viaja en una query string.
     */
    function empaquetarEstado(state, callback) {
      const bruto = btoa(JSON.stringify({ s: state, cb: callback }));
      return bruto.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function desempaquetarEstado(valor) {
      try {
        const bruto = String(valor).replace(/-/g, '+').replace(/_/g, '/');
        const datos = JSON.parse(atob(bruto));
        if (!datos || typeof datos.s !== 'string' || typeof datos.cb !== 'string') return null;
        // El state original lo genera Atlas con randomBytes(24).toString('hex').
        if (!/^[0-9a-f]{16,128}$/.test(datos.s)) return null;
        if (!validCallback(datos.cb)) return null;
        return datos;
      } catch { return null; }
    }

    // ── Vuelta de Meta ──────────────────────────────────────────────────────
    // Se distingue por traer `code` o `error` junto al `state` empaquetado.
    const codeDeVuelta = params.get('code');
    const errorDeVuelta = params.get('error');
    if (codeDeVuelta || errorDeVuelta) {
      const datos = desempaquetarEstado(params.get('state'));
      if (!datos) {
        fail('La respuesta de Meta no se puede asociar a esta sesión de Atlas. Vuelve a empezar desde Atlas.');
      } else {
        statusEl.textContent = 'Volviendo a Atlas…';
        // La query lleva el `code`: fuera de la barra y del historial en cuanto
        // se ha leído. Es de un solo uso, así que recargar no debe reintentarlo.
        if (history && typeof history.replaceState === 'function') {
          history.replaceState(null, '', location.pathname);
        }
        returnToAtlas(datos.cb, datos.s, codeDeVuelta
          ? { code: codeDeVuelta }
          : { error: /^[a-z_]{1,64}$/.test(errorDeVuelta) ? errorDeVuelta : 'access_denied' });
      }
    } else {
      // ── Ida: comprobar los parámetros y preparar el diálogo ───────────────
      const appId = params.get('app_id');
      const configId = params.get('config_id');
      const state = params.get('state');
      const callback = params.get('callback');
      // Entradas que van a Meta: se validan por FORMA. No eligen la
      // aplicación —esa la fija la pareja de arriba—, pero impiden colar algo
      // que no sea un identificador de característica ni una versión de Graph.
      const featureBruto = params.get('feature'); // coexistencia: whatsapp_business_app_onboarding
      const feature = /^[a-z_]{1,64}$/.test(featureBruto || '') ? featureBruto : null;
      const versionBruta = params.get('graph_version');
      const graphVersion = /^v\d{1,3}\.\d{1,3}$/.test(versionBruta || '') ? versionBruta : 'v23.0';

      const publicada = location.origin + location.pathname;

      if (!appId || !configId || !state || !callback) {
        fail('Faltan parámetros. Abre esta página desde el botón «Conectar WhatsApp» de Atlas.');
      } else if (appId !== APP_ID_PERMITIDO || configId !== CONFIG_ID_PERMITIDO) {
        // Rechazo EXPLÍCITO, nunca sustitución silenciosa: se dice cuál de los
        // dos no cuadra para que un fallo de configuración de Atlas se
        // diagnostique de un vistazo, sin repetir en la página el valor
        // recibido (que lo controla quien abre el enlace).
        const cuales = appId !== APP_ID_PERMITIDO
          ? (configId !== CONFIG_ID_PERMITIDO ? 'la aplicación y la configuración no coinciden' : 'la aplicación no coincide')
          : 'la configuración no coincide';
        fail(`Esta página solo funciona con la aplicación de Atlas: ${cuales}. Ábrela desde Atlas.`);
      } else if (!validCallback(callback)) {
        fail('El destino de retorno no es válido. Abre esta página desde Atlas.');
      } else if (publicada !== REDIRECT_URI) {
        // Publicada en otra ruta que la declarada: el canje fallaría con
        // subcode=36008 y sin ninguna pista. Se para aquí, con el motivo.
        fail('Esta página no está publicada en la dirección que espera la aplicación de Meta. Avisa al fabricante.');
      } else {
        const estadoEmpaquetado = empaquetarEstado(state, callback);
        // El `state` y el puerto local salen de la barra de direcciones en
        // cuanto se han leído: quedarían en el historial y el state es de un
        // solo uso, así que recargar no debía funcionar.
        if (history && typeof history.replaceState === 'function') {
          history.replaceState(null, '', location.pathname);
        }

        const extras = { setup: {}, sessionInfoVersion: '3' };
        if (feature) extras.featureType = feature;
        const dialogo = new URL(`https://www.facebook.com/${graphVersion}/dialog/oauth`);
        dialogo.searchParams.set('client_id', appId);
        dialogo.searchParams.set('config_id', configId);
        dialogo.searchParams.set('response_type', 'code');
        dialogo.searchParams.set('override_default_response_type', 'true');
        dialogo.searchParams.set('redirect_uri', REDIRECT_URI);
        dialogo.searchParams.set('state', estadoEmpaquetado);
        dialogo.searchParams.set('extras', JSON.stringify(extras));

        button.disabled = false;
        statusEl.textContent = 'Pulsa el botón para abrir el proceso de Meta.';
        button.addEventListener('click', () => {
          button.disabled = true;
          statusEl.textContent = 'Abriendo el proceso de Meta…';
          location.assign(dialogo.toString());
        });
      }
    }
  </script>
</body>
</html>
